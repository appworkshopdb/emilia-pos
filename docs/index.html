<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für dich 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --rose:#c4607a;--rose-lt:#e8a0b0;--deep:#2a1028;--plum:#4a1942;
  --plum-lt:#7a3568;--gold:#c9a96e;--gold-lt:#e8d4a8;
  --text:#f5e8ed;--text-s:#d4b8c4;--canvas-bg:#1a0a18;
}
html,body{min-height:100%;font-family:'Lato',sans-serif;font-weight:300;color:var(--text)}
body{
  background:
    radial-gradient(ellipse 120% 80% at 20% 10%,rgba(74,25,66,.55) 0%,transparent 60%),
    radial-gradient(ellipse 80% 60% at 80% 90%,rgba(196,96,122,.18) 0%,transparent 55%),
    var(--canvas-bg);
  min-height:100vh;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:rgba(245,232,237,.6);animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.3)}}
.page-wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:2.5rem 1.2rem 5rem;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;margin-bottom:2rem}
.eyebrow{font-size:.68rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:.6rem}
.header h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:400;line-height:1.2}
.header h1 em{font-style:italic;color:var(--rose-lt)}
.header-sub{margin-top:.8rem;font-size:.85rem;color:var(--text-s);line-height:1.65;max-width:380px}
.divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1.2rem auto}
.day-tabs{display:flex;gap:.6rem;margin-bottom:1.8rem;width:100%;max-width:420px}
.tab-btn{
  flex:1;padding:.65rem 1rem;border:1px solid rgba(196,96,122,.3);border-radius:50px;
  background:rgba(74,25,66,.3);color:var(--text-s);font-family:'Lato',sans-serif;
  font-size:.83rem;letter-spacing:.06em;cursor:pointer;transition:all .3s;backdrop-filter:blur(8px)
}
.tab-btn:hover{border-color:var(--rose);color:var(--rose-lt)}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(196,96,122,.5),rgba(122,53,104,.6));
  border-color:var(--rose);color:var(--text);box-shadow:0 0 18px rgba(196,96,122,.25)
}
.tab-btn small{display:block;font-size:.7rem;margin-top:.15rem;opacity:.65}
.panel{display:none;width:100%}
.panel.active{display:block}
.game-box{
  background:rgba(42,16,40,.7);border:1px solid rgba(196,96,122,.2);border-radius:20px;
  padding:1.5rem 1.2rem;backdrop-filter:blur(12px)
}
.game-header{text-align:center;margin-bottom:1.2rem}
.game-title{font-family:'Playfair Display',serif;font-style:italic;font-size:1.1rem;color:var(--rose-lt)}
.game-counter{
  display:inline-flex;align-items:center;gap:.4rem;margin-top:.5rem;
  background:rgba(196,96,122,.12);border:1px solid rgba(196,96,122,.25);
  border-radius:50px;padding:.3rem .9rem;font-size:.78rem;color:var(--text-s)
}
.game-counter .count{color:var(--rose-lt);font-weight:400}
.lot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem}

/* LOT: always same height, position relative for canvas overlay */
.lot{
  aspect-ratio:3/4;border-radius:14px;position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  background:#1a0a18;
}

/* Revealed image — hidden by default, shown only when revealed */
.lot-img{
  width:100%;height:100%;object-fit:cover;display:block;border-radius:14px;
  position:absolute;inset:0;
  opacity:0;transition:opacity .5s;
}
.lot.revealed .lot-img{ opacity:1; }

/* Scratch canvas sits on top of the (invisible) image */
.scratch-canvas{
  position:absolute;inset:0;border-radius:14px;touch-action:none;cursor:crosshair;
  z-index:2;
}
.scratch-canvas.fading{pointer-events:none;opacity:0;transition:opacity .7s}

/* Solid cover for locked lots — completely hides the image */
.lock-overlay{
  position:absolute;inset:0;border-radius:14px;z-index:3;
  background:#1a0a18;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;
}
.lock-overlay .lock-icon{font-size:1.6rem;opacity:.4}
.lock-overlay .lock-text{font-size:.6rem;color:var(--text-s);letter-spacing:.08em;text-align:center;line-height:1.5;padding:0 .4rem}

/* Revealed ribbon */
.lot-ribbon{
  position:absolute;top:0;left:0;right:0;z-index:10;
  background:linear-gradient(135deg,rgba(196,96,122,.85),rgba(122,53,104,.85));
  color:#fff;font-size:.6rem;letter-spacing:.1em;text-align:center;
  padding:.22rem .3rem;display:none
}
.lot.revealed .lot-ribbon{display:block}

/* DONE STATE */
.done-screen{text-align:center;padding:1.2rem 0}
.done-heart{font-size:2.5rem;display:block;animation:pulse 2.5s ease-in-out infinite;margin-bottom:.7rem}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.done-text{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;color:var(--rose-lt);line-height:1.6}
.done-sub{font-size:.75rem;color:var(--text-s);margin-top:.4rem}
.done-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.done-thumb{aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid rgba(196,96,122,.3)}
.done-thumb img{width:100%;height:100%;object-fit:cover}
.done-thumb.blank{background:#120810;}

/* WAITING STATE */
.wait-screen{text-align:center;padding:1.5rem 0}
.wait-icon{font-size:2rem;display:block;margin-bottom:.6rem;opacity:.55}
.wait-text{font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;color:var(--text-s);line-height:1.7}

/* FOOTER */
.footer{margin-top:3.5rem;text-align:center}
.footer p{font-size:.7rem;color:rgba(245,232,237,.22);letter-spacing:.1em}

/* TOAST */
.toast{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(42,16,40,.96);border:1px solid var(--rose);border-radius:50px;
  padding:.55rem 1.3rem;color:var(--rose-lt);font-size:.8rem;letter-spacing:.05em;
  opacity:0;transition:all .4s;z-index:999;backdrop-filter:blur(16px);pointer-events:none;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .page-wrap{padding:1.8rem .9rem 4rem}
  .header h1{font-size:1.6rem}
  .lot-grid{gap:.45rem}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="page-wrap">
  <header class="header">
    <p class="eyebrow">nur für dich</p>
    <h1>Deine <em>geheimen</em> Lose</h1>
    <div class="divider"></div>
    <p class="header-sub">Wähle an jedem Tag drei Lose zum Rubbeln. Was wird sich wohl verstecken?</p>
  </header>
  <div class="day-tabs">
    <button class="tab-btn active" onclick="switchTab('fri')" id="tab-fri">
      💗 Freitag<small id="fri-date"></small>
    </button>
    <button class="tab-btn" onclick="switchTab('sun')" id="tab-sun">
      🌹 Sonntag<small id="sun-date"></small>
    </button>
  </div>
  <div class="panel active" id="panel-fri"></div>
  <div class="panel"        id="panel-sun"></div>
  <footer class="footer"><p>mit viel Liebe für dich gemacht 🌸</p></footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ── BILDPFADE — passe die Dateinamen an ──────────────────────────────────────
const IMAGE_PATHS = [
  'images/1.jpg','images/2.jpg','images/3.jpg',
  'images/4.jpg','images/5.jpg','images/6.jpg',
  'images/7.jpg','images/8.jpg','images/9.jpg',
];
// ─────────────────────────────────────────────────────────────────────────────

const LS = {
  seed:'rb_seed', friSlots:'rb_fri_slots', sunSlots:'rb_sun_slots',
  friDone:'rb_fri_done', sunDone:'rb_sun_done',
  friClosed:'rb_fri_closed', sunClosed:'rb_sun_closed',
};
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let friSlots  = lsGet(LS.friSlots)  || null;
let sunSlots  = lsGet(LS.sunSlots)  || null;
let friDone   = lsGet(LS.friDone)   || [];
let sunDone   = lsGet(LS.sunDone)   || [];
let friClosed = lsGet(LS.friClosed) || false;
let sunClosed = lsGet(LS.sunClosed) || false;

function save(){
  lsSet(LS.friSlots,friSlots); lsSet(LS.sunSlots,sunSlots);
  lsSet(LS.friDone,friDone);   lsSet(LS.sunDone,sunDone);
  lsSet(LS.friClosed,friClosed); lsSet(LS.sunClosed,sunClosed);
}

function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function seededShuffle(arr,rng){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function getSeed(){
  let s=lsGet(LS.seed);
  if(s===null){ s=Math.floor(Math.random()*2147483647); lsSet(LS.seed,s); }
  return s;
}

function assignFriSlots(){
  if(friSlots) return;
  friSlots = seededShuffle([0,1,2,3,4,5,6,7,8], mulberry32(getSeed())).slice(0,6);
  save();
}
function assignSunSlots(){
  if(sunSlots) return;
  const excl = new Set(friDone);
  const rem  = [0,1,2,3,4,5,6,7,8].filter(i=>!excl.has(i));
  sunSlots   = seededShuffle(rem, mulberry32(getSeed()+1)).slice(0,6);
  save();
}

function getDateLabel(weekday){
  const now=new Date(), diff=(weekday-now.getDay()+7)%7;
  const d=new Date(now); d.setDate(now.getDate()+(diff===0?0:diff));
  return d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800);
}

// ── RENDER GAME DAY ──────────────────────────────────────────────────────────
function renderDay(panelId, day){
  const container=document.getElementById(panelId);
  container.innerHTML='';

  const slots  = day==='fri' ? friSlots  : sunSlots;
  const done   = day==='fri' ? friDone   : sunDone;
  const closed = day==='fri' ? friClosed : sunClosed;
  const label  = day==='fri' ? '💗 Freitag' : '🌹 Sonntag';

  if(closed){ renderDone(container,day,slots,done,label); return; }

  const box=el('div','game-box');
  const gh=el('div','game-header');
  const gt=el('p','game-title'); gt.textContent=label+' – Wähle deine 3 Lose';
  const gc=el('div','game-counter');
  gc.innerHTML=`<span class="count" id="cnt-${day}">${done.length}</span><span>/ 3 gerubbelt</span>`;
  gh.appendChild(gt); gh.appendChild(gc); box.appendChild(gh);

  const grid=el('div','lot-grid');
  slots.forEach(imgIdx=>{
    const isRevealed = done.includes(imgIdx);
    // FIX: Lock only when 3 already revealed AND this one isn't revealed
    const isLocked   = !isRevealed && done.length >= 3;
    grid.appendChild(buildLot(imgIdx, day, isRevealed, isLocked));
  });
  box.appendChild(grid);
  container.appendChild(box);

  requestAnimationFrame(()=>{
    container.querySelectorAll('.scratch-canvas').forEach(canvas=>{
      const lot=canvas.closest('.lot');
      initScratch(canvas, lot, parseInt(canvas.dataset.idx), day);
    });
  });
}

function buildLot(imgIdx, day, isRevealed, isLocked){
  const lot=el('div','lot'+(isRevealed?' revealed':''));

  // Image always in DOM but hidden via CSS until revealed
  const img=el('img','lot-img');
  img.src=IMAGE_PATHS[imgIdx]; img.alt='';
  lot.appendChild(img);

  // Ribbon shown when revealed
  const ribbon=el('div','lot-ribbon'); ribbon.textContent='enthüllt ✨';
  lot.appendChild(ribbon);

  if(isLocked){
    // Solid opaque cover — no image visible
    const ov=el('div','lock-overlay');
    ov.innerHTML='<span class="lock-icon">🔒</span><span class="lock-text">Heute nicht mehr möglich</span>';
    lot.appendChild(ov);
  } else if(!isRevealed){
    // Scratchable canvas (drawn opaque by initScratch)
    const canvas=el('canvas','scratch-canvas');
    canvas.dataset.idx=imgIdx; canvas.dataset.day=day;
    lot.appendChild(canvas);
  }
  return lot;
}

// ── RENDER DONE ──────────────────────────────────────────────────────────────
function renderDone(container, day, slots, done, label){
  const box=el('div','game-box');
  const scr=el('div','done-screen');
  const heart=el('span','done-heart'); heart.textContent='💗';
  const txt=el('p','done-text');
  txt.textContent=`"Deine ${day==='fri'?'Freitag':'Sonntag'}überraschungen sind enthüllt."`;
  const sub=el('p','done-sub'); sub.textContent='3 von 6 Losen gerubbelt';
  const dg=el('div','done-grid');
  slots.filter(i=>done.includes(i)).forEach(i=>{
    const d=el('div','done-thumb');
    const im=el('img'); im.src=IMAGE_PATHS[i]; im.alt=''; d.appendChild(im); dg.appendChild(d);
  });
  slots.filter(i=>!done.includes(i)).forEach(()=>{
    const d=el('div','done-thumb blank'); dg.appendChild(d);
  });
  scr.appendChild(heart); scr.appendChild(txt); scr.appendChild(sub); scr.appendChild(dg);
  box.appendChild(scr); container.appendChild(box);
}

function renderWaiting(panelId){
  const container=document.getElementById(panelId);
  container.innerHTML='';
  const box=el('div','game-box');
  box.innerHTML=`<div class="wait-screen">
    <span class="wait-icon">🌙</span>
    <p class="wait-text">Deine Sonntagslose erscheinen,<br>sobald du den Freitag abgeschlossen hast.</p>
  </div>`;
  container.appendChild(box);
}

// ── SCRATCH ENGINE ────────────────────────────────────────────────────────────
function initScratch(canvas, lotEl, imgIdx, day){
  const w=lotEl.offsetWidth, h=lotEl.offsetHeight;
  if(!w||!h){ setTimeout(()=>initScratch(canvas,lotEl,imgIdx,day),80); return; }

  const dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';

  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // Fully opaque cover so image is completely hidden
  ctx.fillStyle='#1a0a18';
  ctx.fillRect(0,0,w,h);

  // Decorative heart pattern
  ctx.save(); ctx.globalAlpha=.07; ctx.fillStyle='#c4607a'; ctx.font='18px serif';
  for(let x=12;x<w;x+=36) for(let y=18;y<h;y+=32) ctx.fillText('♥',x,y);
  ctx.restore();

  // Hint text
  ctx.save();
  ctx.fillStyle='#e8a0b0'; ctx.globalAlpha=.85;
  ctx.font='300 11px Lato,sans-serif'; ctx.textAlign='center';
  ctx.fillText('✦  rubbele hier  ✦', w/2, h/2-6);
  ctx.globalAlpha=.5; ctx.fillStyle='#c9a96e'; ctx.font='10px Lato,sans-serif';
  ctx.fillText('um zu enthüllen', w/2, h/2+10);
  ctx.restore();

  // Now switch to erasing mode
  ctx.globalCompositeOperation='destination-out';

  let isDown=false, revealDone=false;
  const brush=Math.max(18, Math.min(w*.13, 46));

  function pos(e){
    const r=canvas.getBoundingClientRect();
    const s=e.touches?e.touches[0]:e;
    return{x:s.clientX-r.left, y:s.clientY-r.top};
  }
  function scratch(x,y){
    ctx.beginPath(); ctx.arc(x,y,brush,0,Math.PI*2); ctx.fill();
    if(!revealDone) checkReveal();
  }
  function checkReveal(){
    const px=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let clear=0;
    for(let i=3;i<px.length;i+=4) if(px[i]<128) clear++;
    if(clear/(canvas.width*canvas.height)*100 > 55){
      revealDone=true;
      onReveal(canvas, lotEl, imgIdx, day);
    }
  }

  canvas.addEventListener('mousedown',e=>{isDown=true;const p=pos(e);scratch(p.x,p.y)});
  canvas.addEventListener('mousemove',e=>{if(!isDown)return;const p=pos(e);scratch(p.x,p.y)});
  canvas.addEventListener('mouseup',()=>isDown=false);
  canvas.addEventListener('mouseleave',()=>isDown=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();isDown=true;const p=pos(e);scratch(p.x,p.y)},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!isDown)return;const p=pos(e);scratch(p.x,p.y)},{passive:false});
  canvas.addEventListener('touchend',()=>isDown=false);
}

function onReveal(canvas, lotEl, imgIdx, day){
  // Fade out canvas, show image underneath
  canvas.classList.add('fading');
  lotEl.classList.add('revealed');
  setTimeout(()=>{ if(canvas.parentNode) canvas.remove(); }, 800);

  // Update state
  if(day==='fri'){
    if(!friDone.includes(imgIdx)) friDone.push(imgIdx);
    // FIX: Only close after exactly 3 reveals
    if(friDone.length >= 3) friClosed = true;
  } else {
    if(!sunDone.includes(imgIdx)) sunDone.push(imgIdx);
    if(sunDone.length >= 3) sunClosed = true;
  }
  save();

  const done = day==='fri' ? friDone : sunDone;
  const cnt  = document.getElementById('cnt-'+day);
  if(cnt) cnt.textContent = done.length;

  const left = 3 - done.length;
  if(left > 0){
    showToast(`Enthüllt ✨ Noch ${left} übrig`);
    // FIX: Do NOT lock anything — just let them pick the next one freely
  } else {
    showToast('Alle 3 Lose gerubbelt 💗');
    // After 3rd reveal: re-render both panels
    setTimeout(()=>{
      if(day==='fri'){ renderFri(); renderSun(); }
      else { renderSun(); }
    }, 1200);
  }
}

// ── ORCHESTRATION ─────────────────────────────────────────────────────────────
function renderFri(){
  assignFriSlots();
  renderDay('panel-fri','fri');
}
function renderSun(){
  if(!friClosed){ renderWaiting('panel-sun'); return; }
  assignSunSlots();
  renderDay('panel-sun','sun');
}
function switchTab(day){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+day).classList.add('active');
  document.getElementById('panel-'+day).classList.add('active');
  // Immer neu rendern beim Tab-Wechsel damit Sonntag aktuell ist
  if(day==='sun') renderSun();
  if(day==='fri') renderFri();
}

function el(tag,cls=''){const e=document.createElement(tag);if(cls)e.className=cls;return e;}

function buildStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<55;i++){
    const s=el('div','star'); const sz=Math.random()*2+.5;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s;opacity:${Math.random()*.4+.1}`;
    c.appendChild(s);
  }
}

document.getElementById('fri-date').textContent=getDateLabel(5);
document.getElementById('sun-date').textContent=getDateLabel(0);
buildStars();
renderFri();
renderSun();
</script>
</body>
</html>
